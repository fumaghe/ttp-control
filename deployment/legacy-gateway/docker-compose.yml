# =============================================================================
# TTP Control — deployment su VPS Linux
# =============================================================================
# Il database è Neon (PostgreSQL gestito): NON c'è nessun servizio database
# qui, e nessun volume di dati da montare.
#
#   docker compose up -d --build      avvia
#   docker compose logs -f            log in tempo reale
#   docker compose down               ferma (SIGTERM → graceful shutdown)
#
# I secret arrivano dal `.env` sull'host, letto a runtime: non entrano mai
# nell'immagine (vedi .dockerignore).
# =============================================================================

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ttp-control:latest
    container_name: ttp-control

    # Riavvio automatico dopo un crash e al riavvio della macchina.
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}

    # Il graceful shutdown chiude il client Discord e il pool PostgreSQL:
    # 30 secondi sono ampiamente sufficienti.
    stop_grace_period: 30s
    stop_signal: SIGTERM

    # Log JSON con rotazione: senza limiti riempirebbero il disco del VPS.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

    # Nessun dato persistente da conservare: lo stato vive su Neon.
    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: 512M
